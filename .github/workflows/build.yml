name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GoPoints-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GoPoints-${{ github.run_number }}
          path: GoPoints-${{ github.run_number }}.apk

      # Каждая сборка из main — отдельный релиз: APK можно скачать прямо с телефона.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GoPoints 0.1.${{ github.run_number }}
          files: GoPoints-${{ github.run_number }}.apk
          make_latest: true
          body: |
            Сборка ${{ github.run_number }} из коммита ${{ github.sha }}.
            Скачайте `GoPoints-${{ github.run_number }}.apk` на телефон и установите поверх прежней версии.
